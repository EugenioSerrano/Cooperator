# Actor DevFlow (agente)
# Autoridad de aprobación (modes/approves): configurada por el humano
# sobre el roster — un agente nunca la habilita ni la modifica.
# `produces` se DERIVA de `role` (mapeo rol → artefactos, §3.0.1).

id: fa-reviewer-agent
name: "Revisor de Análisis Funcional"
role: functional-analyst-reviewer
model: deepseek/deepseek-v4-pro   # por-instancia y autoritativo (revisor — pro)
modes: [executor, approver]
approves: [US, BUG, BOLT-READY]        # dueño: US (FA); BUG funcional; readiness de US funcionales
definition: agents/squad/fa-reviewer-agent/agent.yaml
escalation:
  - "fuentes contradictorias o una regla de negocio ambigua detrás de la US"
write_paths: []
