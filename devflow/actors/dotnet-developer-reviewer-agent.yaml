# Actor DevFlow (agente)
# Autoridad de aprobación (modes/approves): configurada por el humano
# sobre el roster — un agente nunca la habilita ni la modifica.
# `produces` se DERIVA de `role` (mapeo rol → artefactos, §3.0.1).

id: dotnet-developer-reviewer-agent
name: "Revisor Técnico .NET"
role: developer-reviewer
model: deepseek/deepseek-v4-pro   # por-instancia y autoritativo (revisor — pro)
modes: [executor, approver]
approves: [SPEC, MEM]                  # Dev-validator: plan de implementación; paquete del V-Bounce
definition: agents/squad/dotnet-developer-reviewer-agent/agent.yaml
escalation:
  - "la evidencia de test o de gates no puede reproducirse"
write_paths: []
