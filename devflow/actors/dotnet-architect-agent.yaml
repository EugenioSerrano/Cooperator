# Actor DevFlow (agente)
# Borrador executor-only: la autoridad de aprobación (modes: [approver] +
# approves) es un acto de configuración del humano sobre el roster; un
# agente nunca la habilita.
# `produces` se DERIVA de `role` (mapeo rol → artefactos, §3.0.1).

id: dotnet-architect-agent
name: "Arquitecto .NET"
role: architect
model: deepseek/deepseek-flash   # por-instancia y autoritativo (independencia por modelo)
modes: [executor]
approves: []
definition: agents/squad/dotnet-architect-agent/agent.yaml
escalation:
  - "dos ADRs activos se contradirían entre sí"
write_paths: ["devflow/adrs/"]
